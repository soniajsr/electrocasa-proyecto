fuente: catalogo
responsable: area_producto
llegada: snapshots JSON en /Volumes/<catalogo>/default/vol_landing/catalogo/
frecuencia_esperada: trimestral
llave: producto_id
columnas:
  - nombre: producto_id
    tipo: string
    nulo: false
  - nombre: nombre_producto
    tipo: string
    nulo: false
  - nombre: categoria
    tipo: string
    nulo: false
  - nombre: marca
    tipo: string
    nulo: true
  - nombre: precio_lista
    tipo: decimal(12,2)
    nulo: false
    regla: mayor a 0
  - nombre: activo
    tipo: boolean
    nulo: false
  - nombre: fecha_snapshot
    tipo: date
    nulo: false
reglas_de_calidad:
  - nombre: precio_valido
    condicion: "precio_lista > 0"
    politica: drop
    destino_rechazos: silver.cuarentena
problemas_conocidos:
  - precio_lista llega ocasionalmente como cadena con prefijo de moneda
  - productos duplicados dentro del snapshot de marzo