fuente: devoluciones
responsable: area_postventa
llegada: archivos CSV por lote en /Volumes/<catalogo>/default/vol_landing/devoluciones/
frecuencia_esperada: mensual
llave: devolucion_id
columnas:
  - nombre: devolucion_id
    tipo: string
    nulo: false
  - nombre: venta_id
    tipo: string
    nulo: false
  - nombre: producto_id
    tipo: string
    nulo: false
  - nombre: sucursal_id
    tipo: string
    nulo: false
  - nombre: fecha_devolucion
    tipo: date
    nulo: false
  - nombre: motivo
    tipo: string
    nulo: true
  - nombre: monto_reembolso
    tipo: decimal(12,2)
    nulo: false
reglas_de_calidad:
  - nombre: reembolso_valido
    condicion: "monto_reembolso >= 0 AND (monto_venta_origen IS NULL OR monto_reembolso <= monto_venta_origen)"
    politica: drop
    destino_rechazos: silver.cuarentena
problemas_conocidos:
  - montos de reembolso negativos o superiores al monto_total de la venta original
