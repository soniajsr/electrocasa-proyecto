fuente: resenas
responsable: atencion_cliente
llegada: archivos JSON Lines en /Volumes/<catalogo>/default/vol_landing/resenas/
frecuencia_esperada: mensual
llave: resena_id
columnas:
  - nombre: resena_id
    tipo: string
    nulo: false
  - nombre: producto_id
    tipo: string
    nulo: false
  - nombre: fecha_resena
    tipo: date
    nulo: false
  - nombre: calificacion
    tipo: int
    nulo: false
    regla: entre 1 y 5
  - nombre: comentario
    tipo: string
    nulo: true
  - nombre: tags
    tipo: array<string>
    nulo: true
  - nombre: respuestas
    tipo: array<struct<autor:string,texto:string,fecha:string>>
    nulo: true
  - nombre: metadata
    tipo: string
    nulo: true
reglas_de_calidad:
  - nombre: calificacion_rango
    condicion: "calificacion BETWEEN 1 AND 5"
    politica: drop
    destino_rechazos: silver.cuarentena
problemas_conocidos:
  - calificaciones fuera del rango [1, 5]
  - reseñas asociadas a productos inexistentes en el catálogo