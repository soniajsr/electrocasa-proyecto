fuente: ventas
responsable: area_comercial
llegada: archivos CSV por lote en /Volumes/<catalogo>/default/vol_landing/ventas/
frecuencia_esperada: mensual
llave: venta_id
columnas:
  - nombre: venta_id
    tipo: string
    nulo: false
  - nombre: fecha_venta
    tipo: date
    nulo: false
  - nombre: sucursal_id
    tipo: string
    nulo: false
  - nombre: canal
    tipo: string
    nulo: false
  - nombre: producto_id
    tipo: string
    nulo: false
  - nombre: cantidad
    tipo: int
    nulo: false
  - nombre: monto_total
    tipo: decimal(12,2)
    nulo: false
    regla: mayor a 0
  - nombre: metodo_pago
    tipo: string
    nulo: true
  - nombre: vendedor_id
    tipo: string
    nulo: true
reglas_de_calidad:
  - nombre: monto_positivo
    condicion: "monto_total > 0"
    politica: drop
    destino_rechazos: silver.cuarentena
problemas_conocidos:
  - monto_total llega con coma decimal y símbolos de moneda (ej. S/ 1.234,50)
  - fecha_venta presenta múltiples formatos (yyyy-MM-dd, dd/MM/yyyy)
  - filas duplicadas entre lotes sucesivos
